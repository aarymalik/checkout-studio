<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Checkout Studio">
  <!--
    The mark: a payment card on a solid tile.

    Three rectangles and nothing else. The stripe is the tile colour showing
    through the card rather than a third colour, so the whole mark is two values
    and survives being printed, faxed or rendered at 16 pixels in a browser tab.

    Drawn with a margin around the card. Earlier versions filled the tile edge
    to edge and read as a pair of bars rather than as an object.

    The tile keeps its colour in both themes, and the card is solid rather than
    knocked out of the tile: a mark cut as a hole takes the colour of whatever
    is behind it, which in a browser tab is a different colour on every machine.
  -->
  <rect width="32" height="32" rx="8" fill="#2563eb"/>
  <rect x="6" y="10" width="20" height="13" rx="2.5" fill="#ffffff"/>
  <rect x="6" y="13.2" width="20" height="3.4" fill="#2563eb"/>
</svg>
