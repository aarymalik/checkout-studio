name: Feature request
description: Propose a capability
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do that you cannot do today? Describe the problem, not the solution.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you have in mind
  - type: textarea
    id: alternatives
    attributes:
      label: What you have tried or considered
  - type: checkboxes
    id: scope
    attributes:
      label: Before submitting
      options:
        - label: I have checked docs/roadmap.md and docs/phases.md — this is not already planned.
