name: Bug report
description: Something behaves differently than documented
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you saw, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true
  - type: input
    id: correlation
    attributes:
      label: Correlation ID
      description: If an error was shown in the product, it included one. It locates the exact request in our logs.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Editor
        - Renderer / published checkout
        - Payments
        - Publishing
        - Templates
        - API
        - Repository tooling
        - Not sure
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      placeholder: Browser, OS, plan, project size
  - type: checkboxes
    id: security
    attributes:
      label: Security
      options:
        - label: This is not a security vulnerability. (If it is, email security@checkoutstudio.com instead — see SECURITY.md.)
          required: true
