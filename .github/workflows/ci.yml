name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  TURBO_TELEMETRY_DISABLED: 1

jobs:
  verify:
    name: lint · typecheck · test · build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Integration tests run against real services, not mocks: a repository
    # that only passes against a fake is a repository nobody has tested.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: checkout_studio_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:8
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/checkout_studio
      REDIS_URL: redis://localhost:6379

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Create and migrate the test databases
        run: |
          for db in checkout_studio_test_database checkout_studio_test_api; do
            PGPASSWORD=postgres createdb -h localhost -U postgres "$db"
            DATABASE_URL="postgresql://postgres:postgres@localhost:5432/$db" \
              pnpm --filter @checkout-studio/database db:deploy
          done

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      # Capped so the runner is not oversubscribed. Turbo defaults to ten
      # concurrent tasks; on a two-core runner, ten packages' test suites at
      # once turns a 116ms test into a five-second timeout.
      - name: Test
        run: pnpm test
        env:
          TURBO_CONCURRENCY: 4

      # The schema and the state engine are held at 100%, per docs/phases.md
      # Phase 5. The thresholds live in each package's vitest config, and
      # `pnpm test` does not measure coverage — so without this step the
      # requirement is a comment rather than a gate.
      #
      # `pnpm coverage` rather than the filters spelled out here, because they
      # were spelled out here and nowhere else: `pnpm check` ran lint, types,
      # tests, the boundaries and the tokens, and not this — so the script a
      # developer runs to mean "am I good?" passed while the build failed on a
      # threshold. One list, in package.json, run by both.
      - name: Coverage on the engine
        run: pnpm coverage
        env:
          TURBO_CONCURRENCY: 4

      - name: Build
        run: pnpm build

      # The published checkout's budget, from the build that just ran. A
      # transitive import is the usual way this breaks, and neither the layer
      # model nor a lint rule can see one — the first run of this check found
      # 93 KB of zod in every customer's browser, reached from a client-side
      # error boundary through a barrel that re-exports server-only modules.
      - name: The published checkout stays inside its JavaScript budget
        run: pnpm renderer:bundle

  boundaries:
    name: layer boundaries
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Declared dependencies and the resolved import graph obey the layer model
        run: pnpm boundaries

      - name: No component carries a value that belongs in the design system
        run: pnpm tokens:check

      # What the layer model cannot see: eval, raw HTML, and literal values
      # inside the one package that ships to a customer's browser.
      - name: The renderer executes nothing and hardcodes nothing
        run: pnpm renderer:deps

  visual:
    name: visual regression
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # The gallery reads the validated environment, and the placeholders in
      # .env.example are shaped to pass that validation — which is what lets a
      # fresh clone, and this job, start without real credentials.
      #
      # Copied into the application rather than the root: scripts/link-env.mjs
      # deliberately does nothing in CI, where an environment normally comes
      # from the platform rather than from a file.
      - name: Provide an environment
        run: cp .env.example apps/studio/.env.local

      - name: Install the browser
        run: pnpm --filter @checkout-studio/studio exec playwright install --with-deps chromium

      - name: Every component, every variant, light and dark
        run: pnpm test:visual

      # Baselines are per platform: a screenshot taken on macOS does not match
      # one taken here, because the text rasterises differently. When a Linux
      # baseline is missing, Playwright writes it and fails — so the run uploads
      # what it wrote, to be reviewed and committed.
      - name: Upload what changed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-regression
          path: |
            apps/studio/visual/__screenshots__/linux
            apps/studio/playwright-report
            apps/studio/test-results
          retention-days: 7

  audit:
    name: dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Block on high and critical vulnerabilities
        run: pnpm audit --audit-level=high
